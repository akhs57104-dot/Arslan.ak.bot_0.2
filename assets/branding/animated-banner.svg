<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="TECH ARSLAN SOFTWARE SOLUTIONS">
  <title>TECH ARSLAN SOFTWARE SOLUTIONS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#01060f"/>
      <stop offset="50%" stop-color="#04122e"/>
      <stop offset="100%" stop-color="#01060f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e1ff"/>
      <stop offset="50%" stop-color="#66c2ff"/>
      <stop offset="100%" stop-color="#00e1ff"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fd8ff"/>
      <stop offset="100%" stop-color="#2b8fff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e1ff" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#0b4fa0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <g stroke="#0a3f74" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="340"/>
    <line x1="1120" y1="0" x2="1120" y2="340"/>
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="5s" repeatCount="indefinite"/>
  </g>

  <ellipse cx="600" cy="168" rx="540" ry="150" fill="url(#halo)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#00e1ff" opacity="0.85">
    <circle cx="120" cy="90" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;70;90" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="120" r="3">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;145;120" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="250" r="2.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="255" r="2.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="315" r="2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0" y="0" width="1200" height="3" fill="#00e1ff" opacity="0.75">
    <animateTransform attributeName="transform" type="translate" values="0 -3; 0 343; 0 -3" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="66" font-weight="800" letter-spacing="3" fill="url(#neon)" filter="url(#glow)">
      TECH ARSLAN
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="205" font-size="34" font-weight="700" letter-spacing="9" fill="url(#sub)" filter="url(#soft)">
      SOFTWARE SOLUTIONS
      <animate attributeName="opacity" values="1;0.8;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="255" font-size="17" letter-spacing="4" fill="#9fd6ff" opacity="0.95">
      PREMIUM WHATSAPP MULTI-DEVICE AUTOMATION BOT
    </text>
    <text x="600" y="292" font-size="14" letter-spacing="3" fill="#6fb6e8" opacity="0.9">
      Developed and customized by TECH HACKER
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <g stroke="#00e1ff" stroke-width="2" fill="none" opacity="0.9" filter="url(#soft)">
    <path d="M40 40 h60 M40 40 v60">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M1160 40 h-60 M1160 40 v60">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M40 300 h60 M40 300 v-60">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M1160 300 h-60 M1160 300 v-60">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
